  <text x="891" y="161" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="500" fill="#30d158">Isolated</text>
  <line x1="624" y1="186" x2="930" y2="186" stroke="#ffffff" stroke-opacity=".08"/>
</g><g class="up d5">
  <rect x="624" y="198" width="6" height="34" rx="3" fill="#ff9f0a"/>
  <text x="644" y="213" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#f2f3f7">Impossible travel sign-in</text>
