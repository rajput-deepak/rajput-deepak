  <line x1="624" y1="244" x2="930" y2="244" stroke="#ffffff" stroke-opacity=".08"/>
</g><g class="up d6">
  <rect x="624" y="256" width="6" height="34" rx="3" fill="#5e9bff"/>
  <text x="644" y="271" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#f2f3f7">Reported phish</text>
  <text x="644" y="288" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#8a8f9e">M365 · T1566</text>
  <rect x="852" y="261" width="78" height="24" rx="12" fill="#30d158" fill-opacity=".16"/>
  <text x="891" y="277" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="500" fill="#30d158">Purged</text>
