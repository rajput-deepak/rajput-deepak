  <text x="644" y="346" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#8a8f9e">CrowdStrike · T1071</text>
  <rect x="852" y="319" width="78" height="24" rx="12" fill="#30d158" fill-opacity=".16"/>
