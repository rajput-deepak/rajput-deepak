<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-label="Deepak Kumar, Cybersecurity Engineer. I built it. I broke it. Now I defend it.">
<style>
.up{animation:up 1s cubic-bezier(.16,1,.3,1) both}
.d1{animation-delay:.1s}.d2{animation-delay:.25s}.d3{animation-delay:.4s}.d4{animation-delay:.55s}.d5{animation-delay:.7s}.d6{animation-delay:.85s}.d7{animation-delay:1s}.d8{animation-delay:1.15s}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.2s ease-out infinite}
@keyframes ping{0%{opacity:.6;transform:scale(1)}100%{opacity:0;transform:scale(3)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0071e3"/><stop offset="1" stop-color="#0aa6a0"/></linearGradient>
<radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#0071e3" stop-opacity=".35"/><stop offset="1" stop-color="#0071e3" stop-opacity="0"/></radialGradient></defs>
<rect x="1" y="1" width="998" height="428" rx="28" fill="#fbfbfd" stroke="#e3e3e8"/>
<ellipse cx="780" cy="250" rx="300" ry="200" fill="url(#glow)"/>
<g class="up d1">
  <text x="56" y="78" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#1d1d1f">Deepak Kumar</text>
  <circle class="ping" cx="61" cy="107" r="5" fill="#28a745"/><circle cx="61" cy="107" r="5" fill="#28a745"/>
  <text x="76" y="112" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="1.2" fill="#0071e3">CYBERSECURITY ENGINEER · OPEN TO FULL-TIME</text>
</g>
<g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="-2">
  <text class="up d2" x="52" y="196" fill="#1d1d1f">I built it.</text>
  <text class="up d3" x="52" y="260" fill="#1d1d1f">I broke it.</text>
  <text class="up d4" x="52" y="324" fill="url(#g)">Now I defend it.</text>
</g>
<text class="up d5" x="56" y="372" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#6e6e73">6+ years · Incident response · VAPT · Secure web development</text>
<g class="up d3">
  <rect x="600" y="64" width="350" height="320" rx="22" fill="#0c0d12" stroke="#ffffff" stroke-opacity=".08"/>
  <circle cx="624" cy="90" r="5.5" fill="#ff5f57"/><circle cx="642" cy="90" r="5.5" fill="#febc2e"/><circle cx="660" cy="90" r="5.5" fill="#28c840"/>
  <text x="678" y="94" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#8a8f9e">soc / triage</text>
  <circle class="ping" cx="866" cy="90" r="3.5" fill="#30d158"/><circle cx="866" cy="90" r="3.5" fill="#30d158"/>
  <text x="876" y="94" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#8a8f9e">all clear</text>
  <line x1="600" y1="112" x2="950" y2="112" stroke="#ffffff" stroke-opacity=".08"/>
</g>
<g class="up d4">
